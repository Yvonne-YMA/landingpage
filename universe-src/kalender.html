<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>yma universe</title>
<link rel="manifest" href="/universe/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/universe/icon-180.png" />
<link rel="icon" type="image/png" href="/universe/icon-192.png" />
<meta name="theme-color" content="#1b2a4e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="yma universe" />
<link rel="stylesheet" href="/fonts.css" />
<style>
  :root{
    --night:#141f3d; --night2:#1f2d57; --violet:#3b2f63; --pink:#db5a90; --rose:#e386a1;
    --turq:#3ba8a4; --gold:#f6d98a; --gold2:#ffeec2; --text:#eef1fb; --mut:#aeb7d6;
    --disp:"Cormorant Garamond", Georgia, serif; --ui:"Poppins", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{min-height:100%;background:#0d1530;}
  body{
    min-height:100vh; font-family:var(--ui); color:var(--text); line-height:1.65; -webkit-font-smoothing:antialiased;
    background:#0d1530; overflow-x:hidden; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  /* Nachthimmel als feste Ebene (funktioniert auch auf iPhone/iPad) */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(120% 80% at 50% 0%, var(--night2) 0%, var(--night) 55%, #0d1530 100%);}
  /* Funkelnder Hintergrund */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
  .glow{position:fixed;inset:auto -20% -30% -20%;height:70%;pointer-events:none;z-index:0;
    background:radial-gradient(50% 50% at 30% 60%, rgba(219,90,144,.18), transparent 70%),
               radial-gradient(45% 45% at 75% 50%, rgba(59,168,164,.16), transparent 70%);}
  main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:40px 20px 56px;text-align:center;}

  .brand{font-family:var(--disp);font-style:italic;font-size:1.05rem;letter-spacing:.08em;color:var(--mut);}
  h1{font-family:var(--disp);font-weight:500;font-size:clamp(2.6rem,9vw,4.4rem);line-height:1.05;margin:.2em 0 .15em;
     background:linear-gradient(90deg,#fff3c9,#f6d98a 55%,#e8c27a);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{font-family:var(--disp);font-style:italic;font-weight:500;font-size:clamp(1.55rem,5.2vw,2.3rem);color:#f6e3b4;margin-top:.15em;letter-spacing:.01em;}
  .tag{font-family:var(--disp);font-weight:500;color:#f3e6c4;font-size:clamp(1.4rem,4.9vw,1.9rem);line-height:1.28;margin-top:.45rem;letter-spacing:.01em;}
  .br-m{display:none;} @media(max-width:640px){.br-m{display:inline;}}
  .status{margin:22px auto 0;max-width:520px;font-size:.92rem;color:var(--gold2);min-height:1.4em;}

  /* Sternen-Raster */
  .stars{position:relative;margin:26px auto 0;width:100%;max-width:640px;aspect-ratio:1;}
  .star{position:absolute;width:var(--s,72px);height:var(--s,72px);margin:calc(var(--s,72px) / -2) 0 0 calc(var(--s,72px) / -2);
        border:0;background:none;cursor:pointer;color:inherit;font:inherit;display:grid;place-items:center;
        -webkit-tap-highlight-color:transparent;animation:float var(--d,7s) ease-in-out var(--dl,0s) infinite;}
  @keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(var(--fx,4px),var(--fy,-6px))}66%{transform:translate(calc(var(--fx,4px) * -.6),calc(var(--fy,-6px) * -.5))}}
  .star svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .35s ease, filter .35s ease;overflow:visible;}
  .star .num{position:relative;font-family:var(--disp);font-weight:600;font-size:calc(var(--s,72px) * .27);margin-top:8%;}
  /* noch verschlossen */
  .star.locked svg{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.3);}
  .star.locked .num{color:rgba(238,241,251,.5);}
  /* frühere Tage: sanft leuchtend */
  .star.past svg{fill:rgba(246,217,138,.2);stroke:rgba(246,217,138,.85);filter:drop-shadow(0 0 5px rgba(246,217,138,.3));}
  .star.past .num{color:var(--gold2);}
  /* heute: kräftig golden */
  .star.today{z-index:2;}
  .star.today svg{fill:url(#gold);stroke:#fff6d8;filter:drop-shadow(0 0 14px rgba(246,217,138,.95)) drop-shadow(0 0 34px rgba(246,190,110,.55));animation:pulse 2.4s ease-in-out infinite;}
  .star.today .num{color:#3a2a10;}
  .star:hover svg,.star:focus-visible svg{transform:scale(1.1) rotate(-4deg);}
  .star:focus-visible{outline:none;}
  @keyframes pulse{0%,100%{transform:scale(1.08)}50%{transform:scale(1.18)}}
  @media (prefers-reduced-motion: reduce){.star,.star.today svg{animation:none;}}
  /* Sonne in der Mitte (Variante „sonne") */
  .sun{position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
       background:radial-gradient(circle,#fff6d8 0%,#f6d98a 45%,rgba(234,179,106,.0) 72%);display:grid;place-items:center;
       font-family:var(--disp);font-style:italic;font-size:clamp(1.1rem,4vw,1.8rem);color:#3a2a10;pointer-events:none;}

  .legend{margin-top:30px;font-size:.82rem;color:var(--mut);}

  /* Inhalt eines Sterns */
  .dlg{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,12,30,.72);backdrop-filter:blur(6px);}
  .dlg.show{display:flex;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{position:relative;width:min(96vw,600px);aspect-ratio:1;animation:rise .45s ease;}
  @keyframes rise{from{transform:translateY(16px) scale(.94) rotate(-4deg);opacity:.4}to{transform:none;opacity:1}}
  .card .starbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 24px 50px rgba(0,0,0,.4)) drop-shadow(0 0 26px rgba(250,228,170,.28));}
  .card .content{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:56%;max-height:52%;overflow:auto;
        text-align:center;color:#4a5563;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .card .content::-webkit-scrollbar{display:none;}
  .card .content.more{-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
  .card .day{font-size:.78rem;font-weight:600;letter-spacing:.2em;color:var(--pink);margin:0 0 .3em;}
  .card h2{font-family:var(--disp);font-weight:500;font-size:clamp(1.1rem,4.4vw,1.6rem);line-height:1.15;color:#284a7a;margin:0 0 .4em;}
  .card p{margin:0 0 .6em;font-size:clamp(.76rem,3.1vw,.92rem);line-height:1.5;white-space:pre-line;}
  .card .foto{display:block;width:82%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;margin:.1em auto .7em;cursor:zoom-in;
        box-shadow:0 4px 14px rgba(120,90,40,.18);background:#f3e7c8;}
  .card .content.gruss{width:70%;top:53%;}
  .card .content.gruss .day{margin-bottom:.9em;}
  .card .content.gruss{width:74%;}
  .card .content.gruss strong{font-weight:600;color:inherit;}
  .card .content.gruss p{font-size:clamp(.68rem,2.75vw,.88rem);}
  .card .impuls{margin-top:.5em;font-size:clamp(.74rem,3vw,.88rem);line-height:1.5;color:#2c6f6c;}
  .card .impuls b{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:2px;}
  .zoom{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,12,30,.92);cursor:zoom-out;}
  .zoom.show{display:flex;animation:fade .25s ease;}
  .zoom img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .hello{margin-top:14px;border:0;background:none;color:var(--gold2);font:inherit;font-size:.86rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
  .close{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;
         background:rgba(255,255,255,.14);color:#fff;font-size:1.5rem;cursor:pointer;z-index:11;}

  /* Hinweis Startbildschirm */
  .a2hs{position:relative;margin:34px auto 0;max-width:560px;text-align:center;font-size:.88rem;color:var(--text);
        background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 40px;}
  .a2hs .t{display:block;margin-bottom:4px;letter-spacing:.06em;}
  .a2hs b{color:var(--gold2);font-weight:600;}
  .a2hs .x{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--mut);font-size:1.2rem;cursor:pointer;}
  .a2hs[hidden]{display:none;}
  .a2hs .install{display:block;margin-top:10px;border:0;border-radius:999px;padding:9px 18px;background:var(--pink);color:#fff;font:inherit;font-weight:600;cursor:pointer;}
  footer{position:relative;z-index:1;text-align:center;padding:0 20px 34px;font-size:.78rem;color:var(--mut);}
  footer a{color:var(--mut);}
  @media (hover:hover){ .a2hs{display:none!important;} }
  @media (hover:hover) and (min-width:960px){
    main{max-width:1240px;display:grid;grid-template-columns:minmax(320px,1fr) auto;column-gap:40px;align-items:center;
         grid-template-areas:". stars" "h1 stars" "sub stars" "tag stars" "status stars" "legend stars" "hello stars" ". stars";
         grid-template-rows:1fr auto auto auto auto auto auto 1fr;padding-top:14px;padding-bottom:0;}
    main h1{grid-area:h1;}
    main .sub{grid-area:sub;line-height:1.2;}
    main .tag{grid-area:tag;}
    main .status{grid-area:status;margin-top:22px;}
    main .stars{grid-area:stars;width:min(700px, calc(100vh - 150px));max-width:none;margin:8px 0 0;}
    main .legend{grid-area:legend;margin-top:14px;}
    main .hello{grid-area:hello;}
    footer{padding-top:26px;padding-bottom:18px;}
  }
  footer a.gift .giftstar{width:14px;height:14px;vertical-align:-2px;margin-left:4px;filter:drop-shadow(0 0 3px rgba(246,217,138,.7));}
  footer a.gift{display:inline-block;margin-bottom:14px;color:#fff3e6;text-decoration:none;background:rgba(219,90,144,.22);border:1px solid rgba(219,90,144,.6);border-radius:999px;padding:8px 18px;font-size:.86rem;}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c9"/><stop offset=".55" stop-color="#f6d98a"/><stop offset="1" stop-color="#eab36a"/>
    </linearGradient>
    <symbol id="starshape" viewBox="0 0 100 100">
      <path d="M50 4 L62 36 L96 38 L69 59 L79 93 L50 73 L21 93 L31 59 L4 38 L38 36 Z" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<main>
  <h1>yma universe</h1>
  <p class="sub">24 Sterne nur für Dich</p>
  <p class="tag">Jeden Tag ein kleines Strahlen,<br>das Dich trägt.</p>
  <p class="status" id="status"></p>

  <div class="stars" id="stars"></div>
  <p class="legend" id="legend"></p>
  <button class="hello" id="hello" hidden>Deine Begrüßung noch einmal lesen</button>

  <div class="a2hs" id="a2hs" hidden>
    <button class="x" id="a2hsClose" aria-label="Hinweis schließen">×</button>
    <span id="a2hsText"></span>
  </div>
</main>

<footer><a class="gift" href="/universe/geschenk/">Ein Strahlen verschenken <svg class="giftstar" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 L62 36 L96 38 L69 59 L79 93 L50 73 L21 93 L31 59 L4 38 L38 36 Z" fill="url(#gold)" stroke="#fff6d8" stroke-width="5" stroke-linejoin="round"/></svg></a><br>© 2026 Yvonne Müller-Andert · <a href="https://yma.one" target="_blank" rel="noopener">yma.one</a></footer>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <button class="close" id="close" aria-label="Schließen">×</button>
  <div class="card" id="card">
    <svg class="starbg" viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="cardgold" cx="50%" cy="48%" r="60%"><stop offset="0" stop-color="#fdf4e0"/><stop offset=".65" stop-color="#fbeacd"/><stop offset="1" stop-color="#fcefcc"/></radialGradient></defs>
      <path d="M50.00 3.00 L68.81 27.11 L97.55 37.55 L80.43 62.89 L79.39 93.45 L50.00 85.00 L20.61 93.45 L19.57 62.89 L2.45 37.55 L31.19 27.11 Z" fill="url(#cardgold)" stroke="url(#cardgold)" stroke-width="7" stroke-linejoin="round"/>
    </svg>
    <div class="content" id="cardBody"></div>
  </div>
</div>

<div class="zoom" id="zoom" aria-hidden="true"><img id="zoomImg" alt="" /></div>

<script>
/* ===== Inhalte der 24 Sterne (werden beim Bauen eingesetzt) ===== */
const DATEN = /*INHALTE*/[];
/* Aufbau: { begruessung: {titel, text[]}, sterne: [24 × {titel, text[], fuerDich, foto}] } */
const INHALTE = Array.isArray(DATEN) ? DATEN : (DATEN.sterne || []);
const BEGRUESSUNG = Array.isArray(DATEN) ? null : DATEN.begruessung;

/* Reihenfolge der Sterne im Raster (bewusst gemischt, wie ein Sternenhimmel) */
const ORDER = [7,1,18,12,3,22, 15,9,24,5,20,2, 11,17,4,13,8,21, 6,23,10,16,19,14];

const $ = s => document.querySelector(s);
const TOUCH = window.matchMedia('(hover: none)').matches;
const OPENED_KEY = 'yma-universe-opened';
let opened = [];
try { opened = JSON.parse(localStorage.getItem(OPENED_KEY) || '[]'); } catch (e) {}

/* Heutiges Datum (Testmodus: ?tag=5 simuliert den 5. Dezember) */
function today() {
  const t = new URLSearchParams(location.search).get('tag');
  if (t) return { month: 11, day: Math.max(0, Math.min(31, parseInt(t, 10) || 0)) };
  const d = new Date();
  return { month: d.getMonth(), day: d.getDate() };
}
function unlockedUpTo() {
  const t = today();
  if (t.month === 11) return t.day === 0 ? 0 : Math.min(24, t.day);
  if (t.month <= 10 && !new URLSearchParams(location.search).get('tag') && new Date().getFullYear() > 2026) return 24; // ab Januar: alle bleiben offen
  return 0;                         // vor Dezember
}

/* Anordnung: Sonne in der Mitte, zwei Sternenringe */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function positions(w, h) {
  const out = [];
  {
    const size = w * 0.115;
    for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 8; out.push({ x: .5 + .25 * Math.cos(a), y: .5 + .25 * Math.sin(a), s: size }); }
    for (let i = 0; i < 16; i++) { const a = -Math.PI / 2 + (i + .5) * 2 * Math.PI / 16; out.push({ x: .5 + .43 * Math.cos(a), y: .5 + .43 * Math.sin(a), s: size }); }
  }
  return out;
}

function render() {
  const max = unlockedUpTo(), t = today();
  const wrap = $('#stars'); wrap.innerHTML = '';
  wrap.classList.add('sonne');
  { const sun = document.createElement('div'); sun.className = 'sun'; sun.textContent = 'yma'; wrap.appendChild(sun); }
  const W = wrap.clientWidth, H = wrap.clientHeight, pos = positions(W, H), r = rng(7);
  ORDER.forEach((n, i) => {
    const b = document.createElement('button'), p = pos[i];
    b.className = 'star ' + (n > max ? 'locked' : (n === max && t.month === 11 ? 'today' : 'past'));
    b.style.left = (p.x * 100) + '%'; b.style.top = (p.y * 100) + '%';
    b.style.setProperty('--s', Math.round(p.s) + 'px');
    b.style.setProperty('--d', (6 + r() * 5).toFixed(1) + 's');
    b.style.setProperty('--dl', (-r() * 6).toFixed(1) + 's');
    b.style.setProperty('--fx', ((r() - .5) * 12).toFixed(1) + 'px');
    b.style.setProperty('--fy', ((r() - .5) * 14).toFixed(1) + 'px');
    b.setAttribute('aria-label', 'Stern ' + n + (n > max ? ', noch verschlossen' : ''));
    b.innerHTML = '<svg aria-hidden="true"><use href="#starshape"/></svg><span class="num">' + n + '</span>';
    b.addEventListener('click', () => openStar(n, n <= max));
    wrap.appendChild(b);
  });
  $('#status').innerHTML =
    max === 0 ? 'Am 1. Dezember<br class="br-m"> leuchtet Dein erster Stern auf.'
    : max >= 24 ? 'Alle 24 Sterne leuchten für Dich.'
    : 'Heute leuchtet Stern ' + max + ' für Dich.';
  $('#legend').textContent =
    max === 0 ? ''
    : max >= 24 ? (TOUCH ? 'Tippe' : 'Klicke') + ' Deine Sterne gern immer wieder an.'
    : (TOUCH ? 'Tippe' : 'Klicke') + ' auf einen leuchtenden Stern, um ihn zu öffnen.';
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function head(n) { return '<p class="day">' + String(n).padStart(2, '0') + '.12.</p>'; }
function openStar(n, available) {
  const body = $('#cardBody');
  if (!available) {
    body.innerHTML = head(n) + '<h2 id="dlgTitle">Noch ein bisschen Geduld</h2>' +
      '<p>Dieser Stern leuchtet für Dich ab dem ' + n + '. Dezember.</p>';
  } else {
    const c = INHALTE[n - 1] || { titel: '', text: ['Inhalt folgt.'] };
    const fuer = c.fuerDich || c.impuls;
    body.innerHTML = head(n) + '<h2 id="dlgTitle">' + esc(c.titel) + '</h2>' +
      (c.foto ? '<img class="foto" src="' + c.foto + '" alt="Naturfoto zu Stern ' + n + '" />' : '') +
      (c.text || []).map(p => '<p>' + esc(p) + '</p>').join('') +
      (fuer ? '<div class="impuls"><b>✨ Für Dich</b>' + esc(fuer) + '</div>' : '');
    if (!opened.includes(n)) {
      opened.push(n);
      try { localStorage.setItem(OPENED_KEY, JSON.stringify(opened)); } catch (e) {}
    }
  }
  showCard();
}
function showCard() {
  const body = $('#cardBody');
  $('#dlg').classList.add('show');
  body.scrollTop = 0;
  const more = () => body.classList.toggle('more', body.scrollTop + body.clientHeight < body.scrollHeight - 4);
  body.onscroll = more; requestAnimationFrame(more);
  $('#close').focus();
}
function closeDlg() { $('#dlg').classList.remove('show'); $('#cardBody').classList.remove('gruss'); render(); }

/* Begrüßung: beim ersten Öffnen, danach über den Knopf unter den Sternen */
function openHello() {
  $('#cardBody').classList.add('gruss');
  $('#cardBody').innerHTML = '<p class="day">YMA UNIVERSE</p><h2 id="dlgTitle">' + esc(BEGRUESSUNG.titel || '') + '</h2>' +
    (BEGRUESSUNG.text || []).map(p => '<p>' + esc(p).replace(/^(24 kleine Sterne,?)/, '<strong>$1</strong>') + '</p>').join('');
  showCard();
  try { localStorage.setItem('yma-universe-hello', '1'); } catch (e) {}
}
if (BEGRUESSUNG) {
  $('#hello').hidden = false;
  $('#hello').addEventListener('click', openHello);
  let seen = false;
  try { seen = localStorage.getItem('yma-universe-hello') === '1'; } catch (e) {}
  if (!seen) setTimeout(openHello, 600);
}

/* Foto groß ansehen */
$('#cardBody').addEventListener('click', e => {
  if (e.target.classList.contains('foto')) { $('#zoomImg').src = e.target.src; $('#zoom').classList.add('show'); }
});
$('#zoom').addEventListener('click', () => $('#zoom').classList.remove('show'));
$('#close').addEventListener('click', closeDlg);
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg' || e.target.closest('.starbg')) closeDlg(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#zoom').classList.contains('show')) $('#zoom').classList.remove('show'); else closeDlg();
});

/* Funkelnde Pünktchen */
(function () {
  const sky = $('#sky');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    if (Math.random() < .2) { s.style.width = s.style.height = '3px'; }
    sky.appendChild(s);
  }
})();

/* Hinweis „Zum Startbildschirm hinzufügen" */
(function () {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let dismissed = false;
  try { dismissed = localStorage.getItem('yma-universe-a2hs') === '1'; } catch (e) {}
  if (standalone || dismissed) return;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  let txt;
  if (ios) txt = '<b class="t">Tipp</b>Leg Dir Dein <b>yma universe</b> auf den Startbildschirm. Öffne dazu das <b>Teilen-Menü</b> Deines Browsers (Quadrat mit Pfeil nach oben, je nach Browser unten oder oben rechts) und wähle <b>„Zum Home-Bildschirm"</b>.';
  else if (android) txt = '<b class="t">Tipp</b>Leg Dir Dein <b>yma universe</b> auf den Startbildschirm. Öffne dazu das <b>Menü</b> Deines Browsers (meist ⋮ oder ☰) und wähle <b>„Zum Startbildschirm hinzufügen"</b> oder <b>„App installieren"</b>.';
  else txt = '<b class="t">Tipp</b>Am Handy kannst Du Dir Dein <b>yma universe</b> auf den Startbildschirm legen. Dann ist Dein Stern jeden Tag nur einen Tipp entfernt.';
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    const btn = document.createElement('button');
    btn.className = 'install'; btn.textContent = 'Jetzt auf den Startbildschirm legen';
    btn.addEventListener('click', () => { e.prompt(); });
    $('#a2hs').appendChild(btn);
  });
  $('#a2hsText').innerHTML = txt;
  $('#a2hs').hidden = false;
  $('#a2hsClose').addEventListener('click', () => {
    $('#a2hs').hidden = true;
    try { localStorage.setItem('yma-universe-a2hs', '1'); } catch (e) {}
  });
})();

render();
</script>
</body>
</html>
